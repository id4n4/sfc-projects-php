<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Crea tu cuenta para reservar en Atelier Hair">
    <title>Crear cuenta | Atelier Hair</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">
    <main class="auth-card">
        <a class="brand" href="index.html">Atelier <span>Hair</span></a>
        <h1>Tu próximo look empieza aquí</h1>
        <p class="intro">Crea una cuenta para reservar tus servicios favoritos de forma sencilla.</p>

        <form method="POST">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellidos" autocomplete="name"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave" placeholder="Crea una contraseña"
                    autocomplete="new-password" required>
            </div>

            <button type="submit">Crear cuenta</button>
        </form>

        <p class="form-footer">¿Ya tienes una cuenta? <a href="index.html">Iniciar sesión</a></p>
    </main>
</body>

</html>
